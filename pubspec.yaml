name: f1_2026_app
description: "Formula 1 2026 Season Calendar and Grand Prix Results - Crossplatform Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.3.0
  get_it: ^7.7.0
  talker: ^4.3.0
  talker_flutter: ^4.3.0
  talker_dio_logger: ^4.3.0
  talker_bloc_logger: ^4.3.0
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
